spring.application.name=qldqapi

# Load a local .env file when present. Real deployment environments can inject
# the same variables directly, so no credentials are stored in source code.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
server.port=${SERVER_PORT:8080}

# Supabase/PostgreSQL connection.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}&currentSchema=${DB_SCHEMA:public}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=${DB_SCHEMA:public}

# Code-first schema management. Never use create or create-drop for persistent environments.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
# Do not force hibernate.jdbc.time_zone: PostgreSQL TIME maps directly to LocalTime.
# Absolute timestamps use TIMESTAMPTZ and OffsetDateTime/Instant.
spring.jpa.properties.hibernate.format_sql=true

# Keep the default pool conservative for hosted PostgreSQL/Supabase.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Chỉ bật khi chủ động đặt SQL_INIT_MODE=always. seed.sql có TRUNCATE dữ liệu nghiệp vụ.
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.encoding=UTF-8

# Application-facing settings.
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}
server.servlet.session.timeout=${SESSION_TIMEOUT:90m}
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=${SESSION_JDBC_INITIALIZE_SCHEMA:always}
spring.session.jdbc.table-name=SPRING_SESSION
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.timezone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}
app.notifications.reminder-hours=${NOTIFICATION_REMINDER_HOURS:12,2}
app.notifications.scheduler-delay-ms=${NOTIFICATION_SCHEDULER_DELAY_MS:60000}
